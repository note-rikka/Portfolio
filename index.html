<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #0f0f0f;
            color: #f3f3f3;
        }

        /* Bold display font utility */
        .font-display {
            font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
            font-weight: 900;
            letter-spacing: -0.04em;
        }

        /* Smooth transition for hover effects */
        .img-hover {
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f0f0f;
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-white selection:text-black">

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-6 py-12 md:py-20 w-full">

        <!-- Header Section -->
        <header class="mb-16 md:mb-24 border-b border-neutral-800 pb-12">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-end gap-8">
                <div>
                    <!-- Name / Title -->
                    <h1 class="font-display text-6xl sm:text-7xl md:text-8xl lg:text-9xl uppercase tracking-tighter leading-none mb-6 text-white">
                        Nova Sahrul
                    </h1>
                    <!-- Short Description -->
                    <p class="text-neutral-400 text-lg sm:text-xl md:text-2xl max-w-2xl font-light leading-relaxed">
                        Portrait Photographer, occasional film photography based in Cicalengka.
                    </p>
                </div>

                <!-- Contact & Links (Minimal) -->
                <div class="flex flex-col gap-2 text-sm md:text-base font-medium tracking-wide text-neutral-400">
                    <a href="mailto:novasahru85l@gmail.com" class="hover:text-white transition-colors duration-200 underline decoration-neutral-700 underline-offset-4">
                        Contact me
                    </a>
                    <a href="https://instagram.com/note_nova" target="_blank" rel="noopener" class="hover:text-white transition-colors duration-200">
                        Instagram ↗
                    </a>
                </div>
            </div>

            <!-- Filter Buttons -->
            <div class="flex flex-wrap gap-6 mt-12 text-sm uppercase tracking-widest font-bold text-neutral-500">
                <button onclick="filterCategory('all')" class="filter-btn text-white transition-colors duration-200" data-cat="all">All Works</button>
                <button onclick="filterCategory('portrait')" class="filter-btn hover:text-white transition-colors duration-200" data-cat="portrait">Portrait</button>
                <button onclick="filterCategory('family')" class="filter-btn hover:text-white transition-colors duration-200" data-cat="family">Family</button>
                <button onclick="filterCategory('group')" class="filter-btn hover:text-white transition-colors duration-200" data-cat="group">Group</button>
                <button onclick="filterCategory('film')" class="filter-btn hover:text-white transition-colors duration-200" data-cat="film">Film</button>
            </div>
        </header>

        <!-- Gallery Grid -->
        <section id="gallery" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8">
            <!-- Items injected by JS for easy management -->
        </section>

    </main>

    <!-- Footer Section -->
    <footer class="max-w-7xl mx-auto px-6 py-10 w-full border-t border-neutral-900 flex flex-col sm:flex-row justify-between items-center text-xs uppercase tracking-widest text-neutral-600 gap-4">
        <p>© <span id="year"></span> NOVA SAHRUL. ALL RIGHTS RESERVED.</p>
        <p class="font-mono">PORTFOLIO</p>
    </footer>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="fixed inset-0 bg-black/95 z-50 hidden flex items-center justify-center p-4 md:p-10 backdrop-blur-sm transition-opacity duration-300 opacity-0">
        <!-- Close Button -->
        <button onclick="closeLightbox()" class="absolute top-6 right-6 text-neutral-400 hover:text-white transition-colors p-2" aria-label="Close modal">
            <i data-lucide="x" class="w-8 h-8"></i>
        </button>

        <!-- Lightbox Content -->
        <div class="max-w-5xl max-h-[85vh] flex flex-col items-center">
            <img id="lightbox-img" src="" alt="" class="max-h-[75vh] w-auto object-contain mb-4 rounded-sm">
            <div class="text-center">
                <h3 id="lightbox-title" class="text-white font-display text-xl uppercase tracking-wider"></h3>
                <p id="lightbox-meta" class="text-neutral-500 text-sm mt-1 uppercase tracking-widest font-mono"></p>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        // Gallery Data (3:2 aspect ratio, 2026, formatted as photos/category (num).webp)
        const photos = [
            // Portraits (6)
            {
                id: 1,
                title: "Portrait Study 01",
                category: "portrait",
                year: "2026",
                location: "Cicalengka",
                aspect: "aspect-[2/3]",
                url: "photos/portrait (1).webp"
            },
            {
                id: 2,
                title: "Portrait Study 02",
                category: "portrait",
                year: "2026",
                location: "Cicalengka",
                aspect: "aspect-[2/3]",
                url: "photos/portrait (3).webp"
            },
            {
                id: 3,
                title: "Portrait Study 03",
                category: "portrait",
                year: "2026",
                location: "Bandung",
                aspect: "aspect-[1/1]",
                url: "photos/portrait (2).webp"
            },
            {
                id: 4,
                title: "Portrait Study 04",
                category: "portrait",
                year: "2026",
                location: "Cicalengka",
                aspect: "aspect-[2/3]",
                url: "photos/portrait (4).webp"
            },
            {
                id: 5,
                title: "Portrait Study 05",
                category: "portrait",
                year: "2026",
                location: "Bandung",
                aspect: "aspect-[2/3]",
                url: "photos/portrait (5).webp"
            },
            // Family (3)
            {
                id: 7,
                title: "Family Session 01",
                category: "family",
                year: "2026",
                location: "Cicalengka",
                aspect: "aspect-[2/3]",
                url: "photos/family (1).webp"
            },
            {
                id: 8,
                title: "Family Session 02",
                category: "family",
                year: "2026",
                location: "Bandung",
                aspect: "aspect-[2/3]",
                url: "photos/family (2).webp"
            },
            // Group (3)
            {
                id: 10,
                title: "Group Session 01",
                category: "group",
                year: "2026",
                location: "Cicalengka",
                aspect: "aspect-[2/3]",
                url: "photos/group (1).webp"
            },
            {
                id: 11,
                title: "Group Session 02",
                category: "group",
                year: "2026",
                location: "Cicalengka",
                aspect: "aspect-[3/3]",
                url: "photos/group (2).webp"
            },
            // Film (3)
            {
                id: 13,
                title: "35mm Roll 01",
                category: "film",
                year: "2026",
                location: "Bandung",
                aspect: "aspect-[2/3]",
                url: "photos/film (1).webp"
            },
            {
                id: 14,
                title: "35mm Roll 02",
                category: "film",
                year: "2026",
                location: "Majalaya",
                aspect: "aspect-[2/3]",
                url: "photos/film (2).webp"
            },
            {
                id: 15,
                title: "35mm Roll 03",
                category: "film",
                year: "2026",
                location: "Majalaya",
                aspect: "aspect-[3/3]",
                url: "photos/film (3).webp"
            }
        ];

        // Render Gallery
        function renderGallery(items) {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = items.map(photo => `
                <div class="gallery-item group cursor-pointer overflow-hidden relative" data-category="${photo.category}" onclick="openLightbox(${photo.id})">
                    <div class="w-full ${photo.aspect} bg-neutral-900 overflow-hidden rounded-sm">
                        <img
                            src="${photo.url}"
                            alt="${photo.title}"
                            loading="lazy"
                            class="w-full h-full object-cover img-hover group-hover:scale-105 group-hover:opacity-90"
                            onerror="this.onerror=null; this.src='https://placehold.co/1200x800/1a1a1a/ffffff?text=${encodeURIComponent(photo.url)}'"
                        />
                    </div>
                    <!-- Caption overlay / label below -->
                    <div class="mt-3 flex justify-between items-baseline text-xs uppercase tracking-wider">
                        <span class="font-bold text-neutral-200 group-hover:text-white transition-colors">${photo.title}</span>
                        <span class="text-neutral-500 font-mono">${photo.location} — ${photo.year}</span>
                    </div>
                </div>
            `).join('');
        }

        // Filter Logic
        function filterCategory(category) {
            // Update active state on buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.dataset.cat === category) {
                    btn.classList.add('text-white');
                    btn.classList.remove('text-neutral-500');
                } else {
                    btn.classList.remove('text-white');
                    btn.classList.add('text-neutral-500');
                }
            });

            if (category === 'all') {
                renderGallery(photos);
            } else {
                const filtered = photos.filter(p => p.category === category);
                renderGallery(filtered);
            }
        }

        // Lightbox Functions
        function openLightbox(id) {
            const photo = photos.find(p => p.id === id);
            if (!photo) return;

            const modal = document.getElementById('lightbox');
            const img = document.getElementById('lightbox-img');
            const title = document.getElementById('lightbox-title');
            const meta = document.getElementById('lightbox-meta');

            img.src = photo.url;
            img.alt = photo.title;
            title.textContent = photo.title;
            meta.textContent = `${photo.category} • ${photo.location} • ${photo.year}`;

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
            }, 10);

            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            const modal = document.getElementById('lightbox');
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                document.body.style.overflow = 'auto';
            }, 300);
        }

        // Close modal on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLightbox();
        });

        // Close modal on background click
        document.getElementById('lightbox').addEventListener('click', (e) => {
            if (e.target.id === 'lightbox') closeLightbox();
        });

        // Initialize page
        window.onload = () => {
            renderGallery(photos);
            lucide.createIcons();
            document.getElementById('year').textContent = new Date().getFullYear();
        };
    </script>
</body>
</html>
